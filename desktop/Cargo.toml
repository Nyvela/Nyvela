[package]
name = "lumdesk"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
font8x8 = "0.3.1"
lamfat = { version = "0.4.3", default-features = false, features = ["lfn", "unicode"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2.6", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = "symbols"
