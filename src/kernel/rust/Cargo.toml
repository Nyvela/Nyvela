[package]
name = "lumen_kernel"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"
crate-type = ["staticlib"]

[dependencies]
lumfw = { path = "../../../../Lumfw" }
lumgfx = { path = "../../../../Lumgfx" }
lumeth = { path = "../../../../Lumeth" }
raw-cpuid = "11.6"
smoltcp = { version = "0.12", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }

[profile.release]
panic = "abort"
opt-level = "s"
